<script>
/* ============ 视口状态 ============ */
let viewStart = -3500, viewEnd = 2200;
const MIN_SPAN = 40; // 最小显示年跨度
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const chartArea = document.getElementById('chartArea');
const tooltip = document.getElementById('tooltip');

let W = 0, H = 0, dpr = 1;
let laneOffsets = []; // 每条泳道当前 Y 偏移

/* ============ 布局：绘制时按当前视口动态分行（贪心，避免重叠） ============ */
let LAYOUT = {};
function buildLayout() {
  LAYOUT = {};
  CIVILIZATIONS.forEach(c => {
    LAYOUT[c.id] = { items: ITEMS.filter(i => i.factions.includes(c.id)).sort((a,b)=>a.start-b.start) };
  });
}

/* ============ 坐标转换 ============ */
function xOf(year) { return (year - viewStart) / (viewEnd - viewStart) * (W - 30) + 15; }
function yearOf(x) { return viewStart + (x - 15) / (W - 30) * (viewEnd - viewStart); }

/* ============ 绘制 ============ */
function draw() {
  dpr = window.devicePixelRatio || 1;
  W = chartArea.clientWidth; H = chartArea.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#f6f4ef';
  ctx.fillRect(0, 0, W, H);

  const lanes = CIVILIZATIONS.filter(c => !c._hidden);
  const laneH = H / lanes.length;
  const rowH = Math.max(14, Math.min(22, laneH / 4));

  // 泳道背景交替
  lanes.forEach((c, li) => {
    if (li % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.018)';
      ctx.fillRect(0, li*laneH, W, laneH);
    }
  });

  // 时间刻度
  const niceStep = niceStepFor(viewEnd - viewStart);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let y = Math.ceil(viewStart / niceStep) * niceStep; y <= viewEnd; y += niceStep) {
    const x = xOf(y);
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    ctx.fillStyle = '#9a9484';
    ctx.font = '11px sans-serif';
    ctx.fillText(formatYear(y), x, 4);
  }
  // 公元分界线
  if (viewStart < 0 && viewEnd > 0) {
    const x = xOf(0);
    ctx.strokeStyle = 'rgba(192,57,43,.35)';
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 条目
  const hovered = new Set();
  lanes.forEach((c, li) => {
    const lay = LAYOUT[c.id];
    if (!lay) return;
    const laneTop = li * laneH;
    const innerTop = laneTop + 18;

    // 泳道标题
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = c.color;
    ctx.font = 'bold 12.5px sans-serif';
    ctx.fillText(c.name, 8, laneTop + 3);
    ctx.fillStyle = '#b5ae9e';
    ctx.font = '10.5px sans-serif';
    ctx.fillText(c.desc.length > 14 ? c.desc.slice(0,14)+'…' : c.desc, 8, laneTop + 19);

    // 动态分行：贪心放置，行数随视口自适应
    const maxRows = Math.max(2, Math.floor((laneH - 26) / 14));
    const rowEnds = new Array(maxRows).fill(-Infinity);
    const minDuration = (viewEnd - viewStart) * 0.004;
    const rowOf = new Map();
    lay.items.forEach(it => {
      const s = it.start, e = Math.max(it.end, it.start + minDuration);
      let r = 0;
      while (r < maxRows && !(s > rowEnds[r])) r++;
      if (r < maxRows) { rowEnds[r] = e; rowOf.set(it, r); }
    });

    const usableH = laneH - 24;
    const rowsUsed = rowOf.size ? Math.max(...rowOf.values()) + 1 : 1;
    const bandH = usableH / rowsUsed;
    const rowH = Math.max(14, Math.min(22, bandH));

    lay.items.forEach(it => {
      if (!rowOf.has(it)) return;
      const x1 = xOf(it.start), x2 = xOf(Math.max(it.end, it.start + minDuration));
      const row = rowOf.get(it);
      const bandTop = innerTop + row * bandH;
      const barH = Math.min(rowH, bandH - 3);
      if (barH < 4) return;
      const y = bandTop + (bandH - barH) / 2;
      if (x2 < -40 || x1 > W + 40) return;

      const isHover = hoverItem === it;
      const isDim = focusItem && focusItem !== it && !isRelated(it, focusItem);
      ctx.globalAlpha = isDim ? 0.18 : (isHover ? 1 : 0.92);
      const col = c.color;
      roundRect(x1, y, Math.max(x2 - x1, 5), barH, Math.min(4, barH/2));
      ctx.fillStyle = isHover ? col : col + (it.type==='person' ? 'cc' : '');
      ctx.fill();
      if (isHover || (focusItem && isRelated(it, focusItem))) {
        ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.globalAlpha = 1;

      it._hit = { x1, y, x2, y2: y + barH, item: it };

      // 标签（仅在空间足够时）
      if ((x2 - x1) > 56 && barH >= 9) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isHover ? col : shade(col, -0.12);
        ctx.font = (it.type === 'person' ? 'italic ' : '') + '11px sans-serif';
        const maxChars = Math.floor((x2 - x1 - 10) / 11.5);
        const label = it.name.length <= maxChars ? it.name : it.name.slice(0, Math.max(maxChars - 1, 1)) + '…';
        ctx.fillText(label, x1 + 6, y + barH / 2);
      }
    });
  });

  // 当前聚焦条目到其他泳道的关系连线
  if (focusItem) {
    ctx.setLineDash([3,3]);
    focusItem.links.forEach(nm => {
      const target = ITEM_INDEX[nm];
      if (!target || !target._hit) return;
      const a = focusItem._hit, b = target._hit;
      if (!a || !b) return;
      const x1 = (a.x1+a.x2)/2, y1 = a.y + (a.y2-a.y)/2;
      const x2 = (b.x1+b.x2)/2, y2 = b.y + (b.y2-b.y)/2;
      const mx = (x1+x2)/2;
      ctx.strokeStyle = 'rgba(138,109,59,.5)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x1,y1);
      ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }
}

function isRelated(it, focus) {
  return focus.links.includes(it.name) || it.links.includes(focus.name) ||
         (it.same_period && it.same_period.some(s => s.includes(focus.name)));
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function niceStepFor(span) {
  const steps = [10, 25, 50, 100, 250, 500, 1000, 2000, 5000];
  const target = span / 10;
  for (const s of steps) if (s >= target) return s;
  return 10000;
}
function formatYear(y) {
  if (y < 0) return '前' + (-y);
  if (y === 0) return '公元';
  return String(y);
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n>>16) + amt*40));
  const g = Math.max(0, Math.min(255, ((n>>8)&255) + amt*40));
  const b = Math.max(0, Math.min(255, (n&255) + amt*40));
  return `rgb(${r},${g},${b})`;
}

/* ============ 交互：hover / click / drag / zoom ============ */
let hoverItem = null, focusItem = null;
let dragging = false, dragStartX = 0, dragStartView = [0,0], moved = false;

function itemAt(mx, my) {
  const lanes = CIVILIZATIONS.filter(c => !c._hidden);
  const laneH = H / lanes.length;
  let li = Math.floor(my / laneH);
  if (li < 0 || li >= lanes.length) return null;
  const c = lanes[li];
  const lay = LAYOUT[c.id];
  if (!lay) return null;
  // 直接扫描该泳道条目命中区域
  for (const it of lay.items) {
    if (!it._hit) continue;
    const h = it._hit;
    if (mx >= h.x1 - 2 && mx <= h.x2 + 2 && my >= h.y - 2 && my <= h.y2 + 2) return it;
  }
  return null;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (dragging) {
    const dx = mx - dragStartX;
    if (Math.abs(dx) > 3) moved = true;
    const span = dragStartView[1] - dragStartView[0];
    const dYears = -dx / (W - 30) * span;
    viewStart = dragStartView[0] + dYears;
    viewEnd = dragStartView[1] + dYears;
    clampView();
    draw();
    return;
  }
  const it = itemAt(mx, my);
  if (it !== hoverItem) { hoverItem = it; draw(); }
  if (it) {
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<b>${it.name}</b><div class="t-meta">${typeLabel(it)} · ${yearRangeStr(it)} · ${it.factions.map(f=>CIVILIZATIONS.find(c=>c.id===f).name).join('、')}</div>点击查看同期世界 →`;
    tooltip.style.left = Math.min(Math.max(mx + 14, 8), Math.max(W - 290, 8)) + 'px';
    tooltip.style.top = (my + 14) + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = dragging ? 'grabbing' : 'grab';
  }
});
canvas.addEventListener('mousedown', e => {
  dragging = true; moved = false;
  dragStartX = e.clientX - canvas.getBoundingClientRect().left;
  dragStartView = [viewStart, viewEnd];
  chartArea.classList.add('dragging');
});
window.addEventListener('mouseup', e => {
  if (dragging && !moved) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx >= 0 && mx <= W && my >= 0 && my <= H) {
      const it = itemAt(mx, my);
      if (it) selectItem(it);
      else clearFocus();
    }
  }
  dragging = false;
  chartArea.classList.remove('dragging');
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const anchor = yearOf(mx);
  const factor = e.deltaY > 0 ? 1.15 : 1/1.15;
  const span = Math.min(Math.max((viewEnd - viewStart) * factor, MIN_SPAN), 8000);
  const ratio = (mx - 15) / (W - 30);
  viewStart = anchor - ratio * span;
  viewEnd = viewStart + span;
  clampView();
  draw();
}, { passive: false });

/* ---- 触摸手势：单指平移 / 双指捏合缩放 ---- */
let touchState = null; // { mode, startX, startView:[s,e], startDist, startMidX }
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchState = { mode: 'pan', startX: e.touches[0].clientX - canvas.getBoundingClientRect().left, startView: [viewStart, viewEnd], moved: false };
  } else if (e.touches.length === 2) {
    const r = canvas.getBoundingClientRect();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchState = {
      mode: 'pinch',
      startDist: Math.hypot(dx, dy),
      startSpan: viewEnd - viewStart,
      startMidX: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left,
      startView: [viewStart, viewEnd],
    };
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!touchState) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    const mx = e.touches[0].clientX - r.left;
    const dx = mx - touchState.startX;
    if (Math.abs(dx) > 4) touchState.moved = true;
    const span = touchState.startView[1] - touchState.startView[0];
    const dYears = -dx / (W - 30) * span;
    viewStart = touchState.startView[0] + dYears;
    viewEnd = touchState.startView[1] + dYears;
    clampView(); draw();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const scale = dist / (touchState.startDist || 1);
    const newSpan = Math.min(Math.max(touchState.startSpan / scale, MIN_SPAN), 8000);
    // 以双指中点为锚
    const anchorMidView = yearOf(touchState.startMidX);
    const ratio = (touchState.startMidX - 15) / (W - 30);
    viewStart = anchorMidView - ratio * newSpan;
    viewEnd = viewStart + newSpan;
    clampView(); draw();
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (touchState && touchState.mode === 'pan' && !touchState.moved && e.touches.length === 0) {
    // 视为点按：选中条目
    const r = canvas.getBoundingClientRect();
    const t = e.changedTouches[0];
    const mx = t.clientX - r.left, my = t.clientY - r.top;
    const it = itemAt(mx, my);
    if (it) selectItem(it); else clearFocus();
  }
  touchState = null;
}, { passive: true });

function clampView() {
  const span = viewEnd - viewStart;
  if (span > 8000) { viewStart = -3500; viewEnd = 2200; }
  if (viewStart < -3600) { viewStart = -3600; viewEnd = viewStart + span; }
  if (viewEnd > 2400) { viewEnd = 2400; viewStart = viewEnd - span; }
}

function zoomTo(a, b) {
  viewStart = a; viewEnd = b; clampView(); draw();
}
function zoomBy(f) {
  const mid = (viewStart + viewEnd) / 2, span = Math.min(Math.max((viewEnd-viewStart)*f, MIN_SPAN), 8000);
  viewStart = mid - span/2; viewEnd = mid + span/2; clampView(); draw();
}
function resetView() { zoomTo(-3500, 2200); }

function selectItem(it) {

    ${renderAnnoSection(it)}
  `;

}
function computeAutoSame(it) {
  const out = [];
  const others = new Set(it.factions);
  ITEMS.forEach(o => {
    if (o === it) return;
    if (o.factions.every(f => others.has(f))) return; // 排除同文明的（手工对照已覆盖）
    // 时间重叠
    if (o.start <= it.end && o.end >= it.start) out.push(o);
  });
  return out.sort((a,b)=>b.start-a.start).slice(0, 24);
}
const sideToggleHTML = '<button class="side-toggle" id="sideToggle" onclick="toggleSide()" aria-label="收起或展开详情栏"><span class="grip"></span><span class="arr">▼</span></button>';

function renderCompare() {
  const a = ITEM_INDEX[document.getElementById('cmpA').value];
  const b = ITEM_INDEX[document.getElementById('cmpB').value];
  const body = document.getElementById('cmpBody');
  if (!a || !b) return;

  // 常用对比组合
  const pairs = [
    ["秦始皇统一中国", "布匿战争"], ["汉武帝", "罗马从共和国到帝国"],
    ["唐朝贞观之治", "伊斯兰教兴起与阿拉伯扩张"], ["孔子", "释迦牟尼"],
    ["郑和下西洋", "哥伦布发现新大陆"], ["工业革命", "康乾盛世"],
    ["甲午战争", "明治维新"], ["改革开放", "信息技术革命"],
  ];
  const quickHtml = pairs.map(p =>
    `<span class="qc" data-p='${JSON.stringify(p)}'>${p[0].slice(0,6)}… × ${p[1].slice(0,6)}…</span>`
  ).join('');
  document.getElementById('cmpQuick').innerHTML = '快速组合：' + quickHtml;
  document.querySelectorAll('#cmpQuick .qc').forEach(el => {
    el.onclick = () => {
      const p = JSON.parse(el.dataset.p);
      document.getElementById('cmpA').value = p[0];
      document.getElementById('cmpB').value = p[1];
      renderCompare();
    };
  });

  // 时间关系分析
  const aMid = (a.start + a.end) / 2, bMid = (b.start + b.end) / 2;
  const overlap = a.start <= b.end && b.start <= a.end;
  const gap = overlap ? 0 : Math.round(Math.abs(aMid - bMid));
  let timeRel;
  if (overlap) {
    const ovS = Math.max(a.start, b.start), ovE = Math.min(a.end, b.end);
    timeRel = `<b>同期并存</b>——两者在 ${fmtY(ovS)} 至 ${fmtY(ovE)} 时间上重叠。它们属于同一个时代横截面，可以直接对照理解。`;
  } else if (aMid < bMid) {
    timeRel = `<b>先后相承</b>——A 发生在 B 之前约 <b>${gap} 年</b>。前者的结果是后者的背景之一。`;
  } else {
    timeRel = `<b>先后相承</b>——B 发生在 A 之前约 <b>${gap} 年</b>。前者的结果是后者的背景之一。`;
  }

  // 共同关联的同期事件（两个条目各自 same_period 中提到同一文明/事件）
  const aCivs = new Set(a.factions), bCivs = new Set(b.factions);
  const sharedCiv = [...aCivs].filter(x => bCivs.has(x)).map(x => CIVILIZATIONS.find(c=>c.id===x).name);
  const bothSameEra = ERAS.filter(e => e.range[0] <= Math.max(a.start,b.start) && e.range[1] >= Math.min(a.end,b.end)).map(e => e.name);

  const colHtml = (it) => {
    const c = CIVILIZATIONS.find(c=>c.id===it.factions[0]);
    return `
      <div class="cmp-col">
        <div class="cmp-col-head" style="background:${c.color}">${it.name}<span class="yr">${yearRangeStr(it)}</span></div>
        <div class="cmp-col-body">
          <div class="lbl">是什么</div>
          ${it.detail}
          <div class="lbl">当时的其他文明</div>
          ${it.same_period.map(s=>`· ${s}`).join('<br>') || '·（暂无标注）'}
        </div>
      </div>`;
  };

  body.innerHTML = `
    <div class="cmp-grid">${colHtml(a)}${colHtml(b)}</div>
    <div class="cmp-analysis">
      <b>时间关系：</b>${timeRel}<br>
      ${sharedCiv.length ? `<b>共同文明圈：</b>${sharedCiv.join('、')}<br>` : ''}
      ${bothSameEra.length ? `<b>所属时代：</b>${bothSameEra.join(' / ')}` : ''}
    </div>
  `;
}

/* ============ 测验模式 ============ */
let quiz = null;
function openQuiz() {
  document.getElementById('quizOverlay').classList.add('show');
  renderQuizSetup();
}
function renderQuizSetup() {
  document.getElementById('quizCard').innerHTML = `
    <div class="ov-head">
      <h2>历史时间测验</h2>
      <button class="ov-close" onclick="closeOverlay('quizOverlay')">✕</button>
    </div>
    <div class="quiz-setup">
      <p>三种题型，用于检验对历史时间脉络的掌握程度。每道题的答案都可以在时间轴上找到出处，答错不扣分，可作为巩固练习。</p>
      <div class="qtypes">
        <div class="qtype" onclick="startQuiz('sort')">
          <h3>时间排序</h3>
          <p>四件事件，按发生时间先后排序</p>
        </div>
        <div class="qtype" onclick="startQuiz('coexist')">
          <h3>同时代判断</h3>
          <p>判断两个人物是否属于同一时代</p>
        </div>
        <div class="qtype" onclick="startQuiz('choice')">
          <h3>选择题</h3>
          <p>根据时期与文明判断对应事件</p>
        </div>
      </div>
    </div>`;
}
function shuffle(arr) { const a = [...arr]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickItems(n, filter) {
  const pool = ITEMS.filter(filter || (()=>true));
  return shuffle(pool).slice(0, n);
}

function startQuiz(type) {
  const questions = [];
  for (let i = 0; i < 5; i++) {
    if (type === 'sort') {
      const its = pickItems(4, it => it.type === 'event');
      if (its.length < 4) continue;
      const sorted = [...its].sort((a,b)=>a.start-b.start);
      questions.push({
        kind: 'sort', items: its, sorted,
        title: '请将以下四个事件按发生时间先后排序（从早到晚，逐个点击）：',
        explain: () => sorted.map((s,idx)=>`${idx+1}. ${s.name}（${fmtY(s.start)}）`).join('<br>'),
      });
    } else if (type === 'coexist') {
      const its = pickItems(2, it => it.type === 'person');
      if (its.length < 2) continue;
      const [x, y] = its;
      const xMid=(x.start+x.end)/2, yMid=(y.start+y.end)/2;
      const coexist = x.start <= y.end && y.start <= x.end && Math.abs(xMid-yMid) < 150;
      const opts = shuffle([['是同时代的人', true], ['不是同时代的人', false]]);
      questions.push({
        kind: 'choice', items: [x, y],
        title: `<b>${x.name}</b>（${fmtY(x.start)}）与 <b>${y.name}</b>（${fmtY(y.start)}）是同时代人吗？`,
        opts: opts.map(o=>o[0]), answers: opts.map(o=>o[1]), correctIdx: opts.findIndex(o=>o[1]===coexist),
        explain: () => `${x.name}活跃于${fmtY(x.start)}前后，${y.name}活跃于${fmtY(y.start)}前后，${coexist ? '两者生活年代确实重叠' : '两者相差较远'}。可在对比视图中查看详情。`,
      });
    } else {
      const target = pickItems(1, it => it.type === 'event' && it.factions.length)[0];
      const decoys = pickItems(3, it => it !== target && it.type === 'event' && !it.factions.includes(target.factions[0]));
      if (!target || decoys.length < 3) continue;
      const opts = shuffle([target, ...decoys]);
      const civName = CIVILIZATIONS.find(c=>c.id===target.factions[0]).name;
      questions.push({
        kind: 'choice', items: [target],
        title: `以下哪个事件属于<b>${civName}</b>、且发生在<b>${fmtY(target.start)}</b>前后？`,
        opts: opts.map(o=>o.name), correctIdx: opts.indexOf(target),
        explain: () => `${target.name}（${fmtY(target.start)}）——${target.detail.slice(0, 80)}…`,
      });
    }
  }
  quiz = { questions, idx: 0, correct: 0, wrongList: [], locked: false };
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.idx];
  if (!q) { renderQuizResult(); return; }
  const card = document.getElementById('quizCard');
  let optsHtml = '';
  if (q.kind === 'sort') {
    optsHtml = `<div class="quiz-opts" id="sortPool">${q.items.map((it,i)=>
      `<div class="quiz-opt" data-i="${i}"><span class="oi">${'甲乙丙丁'[i]}</span>${it.name}</div>`).join('')}</div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--text2)">你排的顺序：<span id="sortPicked" style="color:var(--text)">（尚未选择）</span></div>`;
  } else {
    optsHtml = `<div class="quiz-opts">${q.opts.map((o,i)=>
      `<div class="quiz-opt" data-i="${i}" onclick="answerChoice(${i})"><span class="oi">${'ABCD'[i]}</span>${o}</div>`).join('')}</div>`;
  }
  card.innerHTML = `
    <div class="ov-head">
      <h2>历史时间测验</h2>
      <button class="ov-close" onclick="closeOverlay('quizOverlay')">✕</button>
    </div>
    <div class="quiz-q"><span class="qnum">第 ${quiz.idx+1} 题 / 共 ${quiz.questions.length} 题</span>${q.title}</div>
    ${optsHtml}
    <div id="quizExp"></div>
    <div class="quiz-foot">
      <span class="quiz-score">正确 <b>${quiz.correct}</b> / ${quiz.idx}</span>
      <button class="btn-main" id="quizNext" style="visibility:hidden" onclick="nextQuestion()">下一题 →</button>
    </div>`;
  if (q.kind === 'sort') setupSortQuestion();
}

let sortPicks = [];
function setupSortQuestion() {
  const q = quiz.questions[quiz.idx];
  sortPicks = [];
  document.querySelectorAll('#sortPool .quiz-opt').forEach(el => {
    el.onclick = () => {
      if (el.classList.contains('disabled')) return;
      const i = +el.dataset.i;
      if (sortPicks.includes(i)) return;
      sortPicks.push(i);
      el.classList.add('disabled');
      el.querySelector('.oi').textContent = sortPicks.length;
      document.getElementById('sortPicked').textContent = sortPicks.map(p=>q.items[p].name).join(' → ');
      if (sortPicks.length === q.items.length) judgeSort();
    };
  });
}
function judgeSort() {
  const q = quiz.questions[quiz.idx];
  const correctOrder = q.sorted.map(s => q.items.indexOf(s));
  const isCorrect = sortPicks.join(',') === correctOrder.join(',');
  if (isCorrect) quiz.correct++; else quiz.wrongList.push(q);
  document.querySelectorAll('#sortPool .quiz-opt').forEach(el => el.classList.add('disabled'));
  document.getElementById('sortPicked').innerHTML = isCorrect
    ? '<span style="color:#2e8b57">✓ 正确！</span>' + sortPicks.map(p=>q.items[p].name).join(' → ')
    : `<span style="color:var(--accent2)">✗ 正确顺序：</span>${correctOrder.map(i=>q.items[i].name).join(' → ')}`;
  document.getElementById('quizExp').innerHTML = `<div class="quiz-exp">${q.explain()}</div>`;
  const btn = document.getElementById('quizNext');
  btn.style.visibility = 'visible';
  btn.textContent = quiz.idx + 1 >= quiz.questions.length ? '看结果 →' : '下一题 →';
}
function answerChoice(i) {
  if (quiz.locked) return;
  const q = quiz.questions[quiz.idx];
  quiz.locked = true;
  const els = document.querySelectorAll('.quiz-opts .quiz-opt');
  els.forEach((el, idx) => {
    el.classList.add('disabled');
    if (idx === q.correctIdx) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });
  const isCorrect = i === q.correctIdx;
  if (isCorrect) quiz.correct++; else quiz.wrongList.push(q);
  document.getElementById('quizExp').innerHTML = `<div class="quiz-exp">${isCorrect ? '✓ 回答正确。' : '✗ 正确答案是 ' + 'ABCD'[q.correctIdx] + '。'}${q.explain()}</div>`;
  const btn = document.getElementById('quizNext');
  btn.style.visibility = 'visible';
  btn.textContent = quiz.idx + 1 >= quiz.questions.length ? '看结果 →' : '下一题 →';
  setTimeout(() => { quiz.locked = false; }, 100);
}
function nextQuestion() { quiz.idx++; renderQuestion(); }
function renderQuizResult() {
  const n = quiz.questions.length, c = quiz.correct;
  const grade = c === n ? '优秀' : c >= n*0.7 ? '良好' : c >= n*0.4 ? '继续努力' : '建议先浏览时间轴';
  const comment = c === n ? '全部正确，对历史时间脉络掌握扎实。'
    : c >= n*0.7 ? '成绩良好。可对照时间轴复习答错的题目，加深印象。'
    : c >= n*0.4 ? '已具备基础。建议重点浏览轴心时代与帝国时代两个时段。'
    : '建议先浏览时间轴各时代，熟悉对照关系后再作答。';
  const wrongHtml = quiz.wrongList.length ? `
    <div class="quiz-wrong-list">
      <div style="font-size:12px;color:var(--accent);letter-spacing:2px;margin-bottom:8px">错题回顾</div>
      ${quiz.wrongList.map(q=>`<div class="wl"><b>${q.title.replace(/<[^>]+>/g,'')}</b><br>${q.explain()}</div>`).join('')}
    </div>` : '';
  document.getElementById('quizCard').innerHTML = `
    <div class="ov-head">
      <h2>测验结果</h2>
      <button class="ov-close" onclick="closeOverlay('quizOverlay')">✕</button>
    </div>
    <div class="quiz-result">
      <div class="big" style="font-size:34px;font-weight:700;color:var(--accent)">${grade}</div>
      <h3>${c} / ${n}</h3>
      <p>${comment}</p>
      ${wrongHtml}
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
        <button class="btn-main" onclick="renderQuizSetup()">重新练习</button>
        <button class="btn-ghost" onclick="closeOverlay('quizOverlay')">返回时间轴</button>
      </div>
    </div>`;
}

/* ============ 概念术语卡 ============ */
const TERMS = [
  { term: "王朝", alt: "dynasty", def: "同一家族世袭掌握政权的时期，如商朝、汉朝。判断标准是最高权力在家族内传递，而非疆域大小。" },
  { term: "帝国", alt: "empire", def: "一个中心政权统治多个民族、广阔疆域的国家形态，通常由皇帝（emperor）统治，如罗马帝国、波斯帝国。" },
  { term: "共和国", alt: "republic", def: "国家元首由选举或推举产生（而非世袭）的政体。罗马共和国由元老院与执政官共治，是现代共和制的源头之一。" },
  { term: "封建", alt: "feudal", def: "中国语境（西周）指「封邦建国」——天子分封诸侯；西方语境（中世纪欧洲）指领主-封臣-采邑的契约层级。两者形似而本质不同，考试常考辨析。" },
  { term: "轴心时代", alt: "Axial Age", def: "德国哲学家雅斯贝尔斯提出的概念：公元前800–前200年间，中国（诸子百家）、印度（佛陀）、希腊（苏格拉底）、西亚（犹太教先知）几乎同时诞生奠基性思想，人类精神根基在此奠定。" },
  { term: "大一统", alt: "", def: "中国政治传统中「天下定于一」的理想与制度实践：中央集权、郡县制、书同文。自秦确立后成为中华文明的主旋律，与欧洲「分而不合」形成对照。" },
  { term: "丝绸之路", alt: "Silk Road", def: "连接中国与地中海的陆上贸易网络（并非一条路），丝绸、纸张、香料、宗教、技术沿路双向流动。德国地理学家李希霍芬1877年命名。" },
  { term: "文艺复兴", alt: "Renaissance", def: "14–16世纪发端于意大利的思想文化运动，借助复兴古希腊罗马文化倡导人文主义。Renaissance 本义「再生」。" },
  { term: "宗教改革", alt: "Reformation", def: "1517年路德发起，挑战罗马教廷权威，新教诞生。引发百年宗教战争，也促成政教分离与民族国家。" },
  { term: "工业革命", alt: "Industrial Revolution", def: "18世纪60年代起始于英国的机器生产取代手工劳动的变革：蒸汽机、工厂制、城市化。是「西方为什么领先」这一问题的核心答案之一。" },
  { term: "青铜时代", alt: "Bronze Age", def: "以青铜器为主要生产工具的时期（中国约前2000–前500年），同时伴随城市与文字出现。其后是铁器时代。" },
  { term: "铁器时代", alt: "Iron Age", def: "铁器普及的时期。铁器便宜且锋利，使农耕扩张、平民武装成为可能，深刻改变了战争与社会结构（如战国、亚述）。" },
  { term: "游牧帝国", alt: "nomad empire", def: "草原民族建立的政权（匈奴、突厥、蒙古），机动性强、控制欧亚商路。中国长城、和亲、互市多为应对其而产生；蒙古帝国是人类史上最大陆地帝国。" },
  { term: "冷兵器时代", alt: "", def: "火药武器成熟（约14世纪传入欧洲）之前的时代，战争依赖刀剑弓矛与体力阵法，骑兵长期是最强兵种。" },
];
function openTerm(name, anchorEl) {
  const t = TERMS.find(x => x.term === name);
  if (!t) return;
  const pop = document.getElementById('termPop');
  pop.innerHTML = `
    <button class="term-close" onclick="closeTerm()">✕</button>
    <h4>${t.term}${t.alt ? `<small>${t.alt}</small>` : ''}</h4>
    ${t.def}`;
  pop.style.display = 'block';
  const r = anchorEl.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - 390);
  let top = r.bottom + 8;
  if (top + 200 > window.innerHeight) top = r.top - 200 > 0 ? r.top - pop.offsetHeight - 8 : 20;
  pop.style.left = Math.max(10, left) + 'px';
  pop.style.top = top + 'px';
}
function closeTerm() { document.getElementById('termPop').style.display = 'none'; }
/* 把文本中的术语包成可点击链接（每个术语最多替换一次，避免嵌套） */
function linkifyTerms(text) {
  let html = text;
  TERMS.forEach(t => {
    const kw = t.term;
    const idx = html.indexOf(kw);
    if (idx >= 0 && html.indexOf('term-link', Math.max(0, idx - 60)) < 0) {
      html = html.slice(0, idx)
        + `<span class="term-link" onclick="openTerm('${kw}', this)">${kw}</span>`
        + html.slice(idx + kw.length);
    }
  });
  return html;
}
document.addEventListener('click', e => {
  if (!e.target.closest('.term-pop') && !e.target.closest('.term-link')) closeTerm();
});

/* ============ 课堂演示模式 ============ */
let present = null;
function openPresent() {
  // 播放列表 = 当前视野内可见条目，按时间排序
  const visible = ITEMS.filter(it => it.end >= viewStart && it.start <= viewEnd)
    .sort((a, b) => a.start - b.start);
  if (!visible.length) return;
  present = { list: visible, idx: 0 };
  document.getElementById('presentWrap').classList.add('show');
  renderPresent();
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}
function closePresent() {
  document.getElementById('presentWrap').classList.remove('show');
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function presentPrev() { if (present && present.idx > 0) { present.idx--; renderPresent(); } }
function presentNext() { if (present && present.idx < present.list.length - 1) { present.idx++; renderPresent(); } }
function renderPresent() {
  const it = present.list[present.idx];
  const c = CIVILIZATIONS.find(c => c.id === it.factions[0]);
  document.getElementById('pCount').textContent = `${present.idx + 1} / ${present.list.length}`;
  document.getElementById('pBar').style.width = ((present.idx + 1) / present.list.length * 100) + '%';
  const sameHtml = it.same_period.length
    ? it.same_period.map(s => `<div class="ps">· ${linkifyTerms(s)}</div>`).join('')
    : '<div class="ps">（暂无同期标注）</div>';
  document.getElementById('pContent').innerHTML = `
    <div class="p-civ">
      <span class="pill" style="background:${c.color}">${c.name}</span>
      <span class="yr">${yearRangeStr(it)}</span>
      <span class="yr">${it.type === 'person' ? '人物' : '事件'}</span>
    </div>
    <div class="p-name">${it.name}</div>
    <div class="p-detail">${linkifyTerms(it.detail)}</div>
    <div class="p-same">
      <div class="lbl">同 一 时 期 · 世 界 其 他 文 明</div>
      ${sameHtml}
    </div>`;
}
document.addEventListener('keydown', e => {
  const pw = document.getElementById('presentWrap');
  if (!pw.classList.contains('show')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); presentNext(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); presentPrev(); }
  else if (e.key === 'Escape') closePresent();
});

/* ============ P3-1 教师标注（localStorage 持久化） ============ */
const ANNO_KEY = 'history-timeline-annotations';
function loadAnnos() {
  try { return JSON.parse(localStorage.getItem(ANNO_KEY) || '{}'); } catch { return {}; }
}
function saveAnnos(a) { localStorage.setItem(ANNO_KEY, JSON.stringify(a)); }
let annos = loadAnnos();

function renderAnnoSection(it) {
  const list = annos[it.name] || [];
  const itemsHtml = list.map((t, i) =>
    `<div class="anno-item"><div class="anno-meta">批注 ${i+1}</div>${escapeHtml(t)}</div>`).join('');
  return `
    <div class="anno-section">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>教师批注（本机保存）</span>
        <span>
          <button class="btn-mini" onclick="startAnnoEdit('${it.name.replace(/'/g,"\\'")}')">＋ 新增</button>
          ${list.length ? `<button class="btn-mini danger" onclick="deleteAnno('${it.name.replace(/'/g,"\\'")}')">删除</button>` : ''}
        </span>
      </div>
      <div class="anno-editor" id="annoEditor"></div>
      ${itemsHtml || '<div style="color:#999;font-size:12.5px">暂无批注。可记录考点、讲法、易错点。</div>'}
    </div>`;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function startAnnoEdit(name) {
  const editor = document.getElementById('annoEditor');
  if (editor.dataset.editing === name) return;
  editor.dataset.editing = name;
  editor.innerHTML = `
    <textarea id="annoText" placeholder="例如：考点——郡县制与分封制的对比；讲法——先用对比视图展示…"></textarea>
    <button class="btn-mini" style="background:var(--accent);color:#fff;border:none;padding:5px 14px" onclick="saveAnno('${name.replace(/'/g,"\\'")}')">保存</button>
    <button class="btn-mini" onclick="cancelAnnoEdit()">取消</button>`;
  document.getElementById('annoText').focus();
}
function cancelAnnoEdit() {
  const editor = document.getElementById('annoEditor');
  editor.dataset.editing = '';
  editor.innerHTML = '';
}
function saveAnno(name) {
  const text = document.getElementById('annoText').value.trim();
  if (!text) return;
  (annos[name] = annos[name] || []).push(text);
  saveAnnos(annos);
  cancelAnnoEdit();
  if (focusItem && focusItem.name === name) selectItem(focusItem);
}
function deleteAnno(name) {
  const list = annos[name] || [];
  if (!list.length) return;
  list.pop();
  if (!list.length) delete annos[name];
  saveAnnos(annos);
  if (focusItem && focusItem.name === name) selectItem(focusItem);
}

/* ============ P3-2 分享链接（URL hash 编码视图+选中） ============ */
function buildHash() {
  const p = [Math.round(viewStart), Math.round(viewEnd)];
  if (focusItem) p.push(encodeURIComponent(focusItem.name));
  return '#v=' + p.join(',');
}
function refreshHash() {
  try { history.replaceState(null, '', buildHash()); } catch {}
}
function applyHash() {
  const m = location.hash.match(/#v=(-?\d+),(-?\d+)(?:,(.+))?/);
  if (!m) return false;
  const s = +m[1], e = +m[2];
  if (isFinite(s) && isFinite(e) && e > s) { viewStart = s; viewEnd = e; clampView(); }
  if (m[3]) {
    const name = decodeURIComponent(m[3]);
    const it = ITEM_INDEX[name];
    if (it) { selectItem(it); const pad = Math.max((it.end-it.start)*1.5, 120); zoomTo(it.start - pad*0.3, it.end + pad*0.7); }
  }
  draw();
  return true;
}
let hashTimer = null;
function scheduleHash() { clearTimeout(hashTimer); hashTimer = setTimeout(refreshHash, 400); }
/* 平移/缩放时同步 hash */
const _origDraw = draw;
draw = function() { _origDraw(); scheduleHash(); };

function copyShareLink() {
  refreshHash();
  const url = location.href;
  const done = () => toast('链接已复制，粘贴即可打开同一视图');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else fallbackCopy(url, done);
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch {}
  document.body.removeChild(ta);
}
function toast(msg) {
  const t = document.getElementById('shareToast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

/* ============ P3-3 讲义导出（打印/PDF） ============ */
function exportHandout() {
  const items = ITEMS.filter(it => it.end >= viewStart && it.start <= viewEnd)
    .sort((a, b) => a.start - b.start);
  if (!items.length) { toast('当前视野内没有条目'); return; }
  const eraNames = ERAS.filter(e => e.range[0] <= viewEnd && e.range[1] >= viewStart).map(e => e.name).join(' / ');
  const rows = items.map(it => {
    const civ = CIVILIZATIONS.find(c => c.id === it.factions[0]);
    const same = it.same_period.map(s => s.replace(/<[^>]+>/g,'')).join('；');
    const anno = (annos[it.name] || []).join(' ／ ');
    return `<tr>
      <td class="t">${fmtY(it.start)}${it.end !== it.start ? '–' + fmtY(it.end).replace('公元','').replace('公元前','前') : ''}</td>
      <td class="c">${civ.name}</td>
      <td><b>${it.name}</b>（${it.type === 'person' ? '人物' : '事件'}）<br>${it.detail}
        ${same ? `<br><i>同期世界：${same}</i>` : ''}
        ${anno ? `<br><span style="color:#2e8b57">批注：${anno}</span>` : ''}
      </td>
    </tr>`;
  }).join('');
  document.getElementById('handout').innerHTML = `
    <h1>中外历史对照 · 一页纸讲义</h1>
    <div class="ho-sub">生成时间：${new Date().toLocaleString('zh-CN')}</div>
    <div class="ho-range">时间范围：${fmtY(viewStart)} — ${fmtY(viewEnd)}　|　时代：${eraNames}</div>
    <table>
      <tr><th style="width:90px">时间</th><th style="width:70px">文明</th><th>内容</th></tr>
      ${rows}
    </table>
    <div class="ho-note">本讲义由「中外历史对照图谱」生成 · 批注为本机保存内容 · 可直接打印或另存为 PDF</div>`;
  toast('讲义已生成，正在打开打印对话框，可另存为 PDF');
  setTimeout(() => window.print(), 350);
}

/* ============ 初始化 ============ */
buildLayout();
if (!applyHash()) resetView();
